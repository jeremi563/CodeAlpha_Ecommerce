<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f6f2">
  <title>Sign in | Nexora Store</title>
  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/auth.js"></script>
</head>
<body>
  <div id="site-header"></div>
  <main class="auth-layout wrap">
    <section class="auth-image auth-image-login"><div class="auth-image-label"><span>THE GOOD ROUTE</span><span>EST. FOR EVERY DAY</span></div></section>
    <section class="auth-panel"><p class="eyebrow">Welcome back</p><h1>Come on in.</h1><p class="muted">Sign in to pick up where you left off.</p>
      <form id="login-form" class="stack-form">
        <label>Email address<input name="email" type="email" autocomplete="email" required></label>
        <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
        <p class="form-message" aria-live="polite"></p>
        <button class="button button-dark button-full" type="submit">Sign in <span aria-hidden="true">→</span></button>
      </form>
      <p class="auth-switch">New to Nexora? <a href="/register.html">Create an account</a></p>
    </section>
  </main>
  <div id="site-footer"></div>
</body>
</html>
